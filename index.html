<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUNAS!! - Enlaces de Instagram</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #000000;
        }
        
        /* Ultra Dark Ambient Glows */
        .bg-glow-red {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: #991b1b;
            filter: blur(150px);
            opacity: 0.12;
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow-dark {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: #450a0a;
            filter: blur(160px);
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }

        /* Red Accent Border Glow */
        .devil-border {
            border: 1px solid rgba(220, 38, 38, 0.2);
        }

        .card-glow:hover {
            box-shadow: 0 0 25px -5px rgba(220, 38, 38, 0.3);
            border-color: rgba(220, 38, 38, 0.6);
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between items-center p-4 relative overflow-x-hidden bg-black">

    <!-- Ambient background glows -->
    <div class="bg-glow-red top-0 left-1/2 -translate-x-1/2"></div>
    <div class="bg-glow-dark bottom-0 right-0"></div>

    <!-- Main Container -->
    <main class="w-full max-w-md my-auto relative z-10 py-8 flex flex-col items-center">
        
        <!-- Header Profile / Avatar Area -->
        <div class="flex flex-col items-center text-center mb-10">
            <div class="relative p-0.5 rounded-full bg-gradient-to-b from-red-600/40 via-red-950/20 to-black mb-5 shadow-2xl shadow-red-950/50">
                <div class="bg-black p-4 rounded-full flex items-center justify-center w-24 h-24 border border-red-900/40 shadow-inner">
                    <!-- Red Devil SVG vector without background -->
                    <svg class="w-16 h-16 filter drop-shadow-[0_0_10px_rgba(220,38,38,0.7)]" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- Left Horn -->
                        <path d="M 33 35 C 28 20, 22 10, 36 24 C 40 28, 41 33, 41 35 Z" fill="#dc2626" />
                        <!-- Right Horn -->
                        <path d="M 67 35 C 72 20, 78 10, 64 24 C 60 28, 59 33, 59 35 Z" fill="#dc2626" />
                        <!-- Devil Head/Face Circle -->
                        <circle cx="50" cy="48" r="21" fill="#dc2626" />
                        <!-- Left Eye -->
                        <path d="M 39 42 Q 45 47 48 48 Q 44 50 39 46 Z" fill="#000000" />
                        <!-- Right Eye -->
                        <path d="M 61 42 Q 55 47 52 48 Q 56 50 61 46 Z" fill="#000000" />
                        <!-- Tail with Arrow Point -->
                        <path d="M 29 48 C 20 65, 30 78, 52 72 C 67 68, 77 56, 84 55" stroke="#dc2626" stroke-width="5" stroke-linecap="round" fill="none"/>
                        <path d="M 75 49 L 88 54 L 81 65 Z" fill="#dc2626" />
                    </svg>
                </div>
            </div>
            <h1 class="text-4xl font-black tracking-widest text-red-600 drop-shadow-[0_0_15px_rgba(220,38,38,0.5)]">
                FUNAS!!
            </h1>
        </div>

        <!-- Links Container -->
        <div class="w-full space-y-4">
            
            <!-- Link 1: Funa 2020 -->
            <a href="https://www.instagram.com/funa_enma/" target="_blank" rel="noopener noreferrer" 
               class="block w-full group">
                <div class="w-full p-4 rounded-2xl bg-zinc-950/90 border border-zinc-900 transition-all duration-300 flex items-center justify-between shadow-2xl backdrop-blur-md group-hover:scale-[1.02] card-glow">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-xl bg-black border border-red-950/80 flex items-center justify-center text-red-600 group-hover:bg-red-600 group-hover:text-white transition-all duration-300 shadow-inner">
                            <i class="fa-brands fa-instagram text-2xl"></i>
                        </div>
                        <div class="text-left">
                            <h2 class="font-bold text-lg text-zinc-100 group-hover:text-red-500 transition-colors">funa 2020</h2>
                            <p class="text-xs text-zinc-600">@funa_enma</p>
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-black border border-zinc-900 flex items-center justify-center text-zinc-600 group-hover:text-white group-hover:bg-red-600 group-hover:border-red-600 transition-all duration-300">
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                    </div>
                </div>
            </a>

            <!-- Link 2: Funa 2026 -->
            <a href="https://www.instagram.com/funa.enmanuel/" target="_blank" rel="noopener noreferrer" 
               class="block w-full group">
                <div class="w-full p-4 rounded-2xl bg-zinc-950/90 border border-zinc-900 transition-all duration-300 flex items-center justify-between shadow-2xl backdrop-blur-md group-hover:scale-[1.02] card-glow">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-xl bg-black border border-red-950/80 flex items-center justify-center text-red-600 group-hover:bg-red-600 group-hover:text-white transition-all duration-300 shadow-inner">
                            <i class="fa-brands fa-instagram text-2xl"></i>
                        </div>
                        <div class="text-left">
                            <h2 class="font-bold text-lg text-zinc-100 group-hover:text-red-500 transition-colors">funa 2026</h2>
                            <p class="text-xs text-zinc-600">@funa.enmanuel</p>
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-black border border-zinc-900 flex items-center justify-center text-zinc-600 group-hover:text-white group-hover:bg-red-600 group-hover:border-red-600 transition-all duration-300">
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                    </div>
                </div>
            </a>

        </div>

        <!-- Quote Phrase Section -->
        <div class="mt-8 w-full text-center px-4">
            <p class="text-sm font-semibold italic text-red-500/90 tracking-wide drop-shadow-[0_0_10px_rgba(220,38,38,0.3)] border-t border-b border-zinc-900/80 py-4">
                "Dónde están los filtros y la protección? Fuera los abusos de la educación"
            </p>
        </div>

        <!-- Link 3: Cuenta de Organización -->
        <div class="w-full mt-6">
            <a href="https://www.instagram.com/organizacion.liceolaportadaa22/" target="_blank" rel="noopener noreferrer" 
               class="block w-full group">
                <div class="w-full p-4 rounded-2xl bg-zinc-950/90 border border-zinc-900 transition-all duration-300 flex items-center justify-between shadow-2xl backdrop-blur-md group-hover:scale-[1.02] card-glow">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-xl bg-black border border-red-950/80 flex items-center justify-center text-red-600 group-hover:bg-red-600 group-hover:text-white transition-all duration-300 shadow-inner">
                            <i class="fa-brands fa-instagram text-2xl"></i>
                        </div>
                        <div class="text-left">
                            <h2 class="font-bold text-lg text-zinc-100 group-hover:text-red-500 transition-colors">cuenta de organizacion</h2>
                            <p class="text-xs text-zinc-600">@organizacion.liceolaportadaa22</p>
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-black border border-zinc-900 flex items-center justify-center text-zinc-600 group-hover:text-white group-hover:bg-red-600 group-hover:border-red-600 transition-all duration-300">
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                    </div>
                </div>
            </a>
        </div>

    </main>

</body>
</html>
